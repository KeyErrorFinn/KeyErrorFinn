<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Finnley, Data and AI Engineer</title>
  <desc id="desc">A dark terminal inspired banner with blue and violet accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#17112b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6cb6ff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .75; } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .pulse { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <circle class="pulse" cx="1060" cy="48" r="125" fill="#7c3aed" opacity=".25" filter="url(#glow)"/>
  <circle class="pulse" cx="102" cy="285" r="120" fill="#0ea5e9" opacity=".2" filter="url(#glow)"/>

  <rect x="54" y="42" width="1092" height="216" rx="14" fill="#090d13" stroke="#303b4a"/>
  <circle cx="82" cy="68" r="6" fill="#ff6b6b"/>
  <circle cx="104" cy="68" r="6" fill="#ffd166"/>
  <circle cx="126" cy="68" r="6" fill="#57cc99"/>

  <text x="78" y="126" fill="#94a3b8" font-family="Cascadia Code, Consolas, monospace" font-size="21">&gt; whoami</text>
  <text x="78" y="183" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="50" font-weight="750" letter-spacing="-1">FINNLEY</text>
  <text x="78" y="220" fill="#e5e7eb" font-family="Cascadia Code, Consolas, monospace" font-size="22">data &amp; AI engineer · full-stack · automation</text>
  <rect class="cursor" x="670" y="201" width="13" height="24" rx="2" fill="#c084fc"/>

  <g transform="translate(840 80)">
    <rect width="280" height="92" rx="12" fill="#111827" stroke="#334155"/>
    <text x="20" y="34" fill="#6cb6ff" font-family="Cascadia Code, Consolas, monospace" font-size="16">status</text>
    <text x="20" y="66" fill="#f8fafc" font-family="Cascadia Code, Consolas, monospace" font-size="16">building useful things</text>
  </g>
</svg>
